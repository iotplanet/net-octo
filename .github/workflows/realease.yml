name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (例如: v1.0.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          - platform: ubuntu-22.04 # 建议锁定 22.04 比较稳定
            target: x86_64-unknown-linux-gnu
            args: ""
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 设置环境
      - name: Setup Node.js
        uses: actions/node-setup@v4
        with:
          node-version: lts/*

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # 2. 优化：缓存 Rust 编译产物，大幅提升后续构建速度
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # 3. 修复：Linux 依赖安装报错
      # 增加 --fix-broken 并清理缓存，确保 libwebkit2gtk 能正常安装
      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          sudo apt-get install -f

      - name: Install frontend dependencies
        run: pnpm install

      # 4. 构建并发布
      - name: Build and Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 修复 tagName 逻辑：如果是手动触发则用输入值，否则用 tag 名
          tagName: ${{ github.event.inputs.version || github.ref_name }}
          releaseName: "Release ${{ github.event.inputs.version || github.ref_name }}"
          releaseBody: "Automated release from GitHub Actions"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
