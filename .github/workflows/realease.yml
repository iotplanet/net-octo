name: Release

on:
  push:
    tags:
      - 'v*'
  # 增加手动触发功能
  workflow_dispatch:
    inputs:
      tag_name:
        description: '发布版本号 (例如: v1.0.0)'
        required: true
        default: 'v0.1.0'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Linux (x86_64) ---
          - os: ubuntu-latest
            platform: linux
            target: x86_64-unknown-linux-gnu
            deps: |
              sudo apt-get update
              sudo apt-get install -y \
                libwebkit2gtk-4.1-dev \
                libgtk-3-dev \
                libayatana-appindicator3-dev \
                librsvg2-dev \
                libsoup-3.0-dev \
                libjavascriptcoregtk-4.1-dev \
                patchelf

          # --- macOS Apple Silicon (M1/M2/M3) ---
          - os: macos-latest
            platform: macos
            target: aarch64-apple-darwin
            deps: ''

          # --- macOS Intel ---
          - os: macos-13
            platform: macos
            target: x86_64-apple-darwin
            deps: ''

          # --- Windows x64 ---
          - os: windows-latest
            platform: windows
            target: x86_64-pc-windows-msvc
            deps: ''

          # --- Windows ARM64 (骁龙 X Elite / Surface) ---
          - os: windows-latest
            platform: windows
            target: aarch64-pc-windows-msvc
            deps: ''

    runs-on: ${{ matrix.os }}

    steps:
      # 1. 检出代码
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # 2. 安装 Rust 工具链 (增加 targets 参数)
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # 3. 设置 Rust 缓存
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # 增加 key 区分不同 target 缓存
          key: ${{ matrix.target }}

      # 4. 安装 pnpm（在 setup-node 之前，避免 Node.js 自带 npm 干扰）
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
          # 不自动运行 install，我们要手动控制
          run_install: false

      # 5. 设置 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          # 注意：pnpm 缓存必须在 setup-node 之后配置
          cache: pnpm

      # 6. 安装系统依赖
      - name: Install system dependencies
        if: matrix.deps != ''
        run: ${{ matrix.deps }}

      # 7. 安装前端依赖
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # 8. 构建 Tauri 2 应用 (增加 --target 参数)
      - name: Build Tauri 2 application
        run: pnpm tauri build --target ${{ matrix.target }}
        env:
          # 可选的 Tauri 代码签名配置
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      # 9. 上传构建产物
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          # 使用 target 命名避免 artifact 名字冲突
          name: bundle-${{ matrix.target }}
          # 产物路径在指定 target 后会变更为 target/${target}/release/bundle
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/
            src-tauri/target/release/bundle/

  create-release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 1. 下载所有构建产物
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          merge-multiple: true
          path: ./artifacts/

      # 关键步骤：确定最终使用的 Tag 名称
      - name: Determine Tag Name
        id: tag_logic
        shell: bash
        run: |
          # 优先使用手动输入，若为空则使用当前推送的 tag
          FINAL_TAG="${{ github.event.inputs.tag_name }}"
          if [ -z "$FINAL_TAG" ]; then
            FINAL_TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$FINAL_TAG" >> $GITHUB_OUTPUT
          echo "Using Tag: $FINAL_TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 使用上面计算出的最终 tag
          tag_name: ${{ steps.tag_logic.outputs.tag }}
          name: "Release ${{ steps.tag_logic.outputs.tag }}"
          files: |
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.dmg
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.sig
          draft: true
          generate_release_notes: true
