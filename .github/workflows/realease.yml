name: Release

on:
  push:
    tags:
      - 'v*' # 当推送 v1.0.0 等标签时触发
  workflow_dispatch: # 支持手动触发
    inputs:
      version:
        description: '发布版本号 (例如: v1.0.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write # 创建 release 的权限

jobs:
  build:
    name: Build - ${{ matrix.platform.target }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          # Linux x86_64
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, command: cargo }
          # Linux ARM64 (使用 cross 交叉编译)
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest, command: cross }
          # macOS x86_64
          - { target: x86_64-apple-darwin, os: macos-latest, command: cargo }
          # macOS ARM64
          - { target: aarch64-apple-darwin, os: macos-latest, command: cargo }
          # Windows x86_64
          - { target: x86_64-pc-windows-msvc, os: windows-latest, command: cargo }

    runs-on: ${{ matrix.platform.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Install Cross (for ARM Linux)
        if: matrix.platform.command == 'cross'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform.target }}

      - name: Build binary
        run: ${{ matrix.platform.command }} build --release --target ${{ matrix.platform.target }}

      - name: Prepare artifacts (Unix)
        if: matrix.platform.os != 'windows-latest'
        run: |
          cd target/${{ matrix.platform.target }}/release
          tar -czf ../../../net-octo-${{ matrix.platform.target }}.tar.gz net-octo
          cd -

      - name: Prepare artifacts (Windows)
        if: matrix.platform.os == 'windows-latest'
        run: |
          cd target/${{ matrix.platform.target }}/release
          7z a ../../../net-octo-${{ matrix.platform.target }}.zip net-octo.exe
          cd -

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: net-octo-${{ matrix.platform.target }}
          path: net-octo-${{ matrix.platform.target }}.*

  publish:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: net-octo-*
          merge-multiple: true

      - name: Get Version
        id: get_version
        shell: bash
        run: |
          # 优先使用手动输入的版本号，其次是 tag
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          files: artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
