<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/net-octo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NetOcto</title>
    <!-- Anti-FOUC: boot-theme.js paints surfaces; #root stays hidden until .nc-app-ready -->
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      #root {
        min-height: 100%;
      }
      html[data-theme='dark'],
      html:not([data-theme]) {
        color-scheme: dark;
        background-color: #0a0a0b;
        color: #f4f4f5;
      }
      html[data-theme='light'] {
        color-scheme: light;
        background-color: #fafafa;
        color: #18181b;
      }
      html:not(.nc-app-ready) #root {
        visibility: hidden;
      }
      html.nc-app-ready #root {
        visibility: visible;
      }
    </style>
    <script src="/boot-theme.js"></script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
